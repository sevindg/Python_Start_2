<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Start · Урок 2 — Переменные и ввод данных</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
color-scheme:light;
--ink:#1c1940; --ink-2:#4d4a72; --ink-3:#8a87a8;
--card:#ffffff; --card-2:#f5f2ff; --line:#e7e2fb;
--violet:#7b5cff; --violet-d:#5a3be0; --pink:#ff6fb0; --peach:#ffb48c; --sky:#5fc3ff; --mint:#3fd7a6; --sun:#ffcf4a; --orange:#ff8a3d;
--ok:#10b47f; --ok-bg:#e6fbf3; --bad:#ef3d6b; --bad-bg:#ffedf2;
--code-bg:#0f0d26; --code-fg:#ecebff; --code-line:#1f1c44;
--bar:#232546; --bar-2:#33365e;
--f-display:"Nunito",system-ui,sans-serif;
--f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
--f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
--clay:0 1px 0 rgba(255,255,255,.95) inset,0 -5px 12px rgba(91,66,190,.07) inset,0 16px 34px -14px rgba(64,40,150,.30),0 3px 8px rgba(64,40,150,.06);
--clay-sm:0 1px 0 rgba(255,255,255,.9) inset,0 -3px 8px rgba(91,66,190,.08) inset,0 8px 18px -10px rgba(64,40,150,.32);
--r-xl:36px; --r-lg:26px; --r-md:18px; --r-sm:12px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#efeaff;color:var(--ink);font-family:var(--f-body);font-weight:600;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
#bg{position:fixed;inset:0;z-index:0;transition:background .6s ease;background:var(--bgimg)}
#bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.3px);background-size:26px 26px;opacity:.45;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.blob.b1{width:42vw;height:42vw;left:-10vw;top:-12vw;background:var(--b1)}
.blob.b2{width:36vw;height:36vw;right:-8vw;bottom:-10vw;background:var(--b2);animation-delay:-6s}
.blob.b3{width:26vw;height:26vw;right:22vw;top:-8vw;background:var(--b3);animation-delay:-11s}
@keyframes drift{to{transform:translate(4vw,3vw) scale(1.08)}}
body[data-bg="0"]{--bgimg:linear-gradient(135deg,#efe4ff 0%,#ffe1ef 45%,#ffe9d9 100%);--b1:#b9a2ff;--b2:#ffb3cf;--b3:#ffd2b3}
body[data-bg="1"]{--bgimg:linear-gradient(135deg,#dff3ff 0%,#e6e4ff 50%,#ffe4f1 100%);--b1:#8fd4ff;--b2:#c3b3ff;--b3:#ffc2dc}
body[data-bg="2"]{--bgimg:linear-gradient(135deg,#d9fbef 0%,#dff1ff 55%,#efe6ff 100%);--b1:#8ff0cb;--b2:#9fd6ff;--b3:#d1c2ff}
body[data-bg="3"]{--bgimg:linear-gradient(135deg,#fff0dd 0%,#ffe3ea 50%,#efe3ff 100%);--b1:#ffcf9f;--b2:#ffb1c6;--b3:#cdb6ff}
body[data-bg="4"]{--bgimg:linear-gradient(135deg,#e9e3ff 0%,#dcf4ff 50%,#dbfbf0 100%);--b1:#b4a4ff;--b2:#8fe3ff;--b3:#93f2cf}
body[data-bg="lab"]{--bgimg:linear-gradient(135deg,#2b1060 0%,#4a1470 50%,#1d1650 100%);--b1:#8a3dff;--b2:#ff4fa8;--b3:#4a6bff}
body[data-bg="night"]{--bgimg:linear-gradient(135deg,#141a4a 0%,#2a1f6e 55%,#0f2b5c 100%);--b1:#5a4dff;--b2:#22c7ff;--b3:#ff5fb0}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:10px 16px 8px}
#stage{flex:1;min-height:0;display:flex;justify-content:center}
.slide{position:relative;width:100%;max-width:1760px;height:100%;overflow-y:auto;overflow-x:hidden;background:rgba(255,255,255,.80);backdrop-filter:blur(14px);border-radius:var(--r-xl);box-shadow:var(--clay);padding:20px clamp(18px,2.6vw,44px) 24px;scrollbar-width:thin}
.slide.anim{animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.slide.dark{background:rgba(18,15,46,.86);color:#eeeaff;--ink:#f3f0ff;--ink-2:#c3bfe6;--ink-3:#8f8bb8;--card:#1c1940;--card-2:#26224f;--line:#35306a}
.sl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font:800 13px/1 var(--f-display);letter-spacing:.04em;background:var(--card-2);color:var(--ink-2)}
.chip.num{background:linear-gradient(135deg,#6f63ff,#a64dff);color:#fff;box-shadow:0 6px 14px -6px rgba(111,99,255,.8)}
.sl-head .sp{flex:1}
.chip.badge{background:#fff4d0;color:#8a5a00;border:1.5px solid #ffe08a}
.dark .chip.badge{background:rgba(255,207,74,.12);color:#ffd76b;border-color:rgba(255,207,74,.35)}
h1.t{font:900 clamp(28px,3.5vw,50px)/1.08 var(--f-display);letter-spacing:-.02em;margin:0 0 12px;color:var(--ink)}
h1.t code{font-family:var(--f-code);font-weight:800;font-size:.86em;background:#e9e6f5;color:var(--ink);border-radius:.25em;padding:.02em .22em}
p.lead{font-size:clamp(16px,1.45vw,21px);line-height:1.55;color:var(--ink-2);margin:0 0 22px;max-width:70ch;font-weight:700}
.body{display:flex;flex-direction:column;gap:20px}
.emj{display:block;line-height:1;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 10px 10px rgba(60,40,140,.22));text-align:center}
.float{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.island{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--clay);padding:20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.icon-bub{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:var(--tint,#efeaff);box-shadow:var(--clay-sm);flex:none}
.icon-bub .emj{font-size:42px}
.card-t{font:800 19px/1.2 var(--f-display);margin:12px 0 6px;color:var(--ink);overflow-wrap:anywhere}
.card-d{font-size:15.5px;line-height:1.5;color:var(--ink-2);margin:0}
.lift{transition:transform .25s ease}
.lift:hover{transform:translateY(-6px)}
.t-violet{--tint:#ece6ff}.t-pink{--tint:#ffe3f0}.t-peach{--tint:#ffeadd}.t-sky{--tint:#dff3ff}.t-mint{--tint:#dcfaef}.t-sun{--tint:#fff4cf}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:20px;font:800 18px/1 var(--f-display);color:#fff;background:linear-gradient(135deg,#14c98e,#0fb3b0);box-shadow:0 6px 0 #08876f,0 16px 26px -10px rgba(16,180,127,.7);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #08876f}
.btn.orange{background:linear-gradient(135deg,#ffa31a,#ff6a2b);box-shadow:0 6px 0 #c4470f,0 16px 26px -10px rgba(255,106,43,.7)}
.btn.violet{background:linear-gradient(135deg,#7b5cff,#b14dff);box-shadow:0 6px 0 #4e2fc4,0 16px 26px -10px rgba(123,92,255,.7)}
.btn.ghost{background:var(--card-2);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sm{padding:11px 16px;font-size:15px;border-radius:15px}
.btn.icon{padding:13px 15px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.code{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r-lg);box-shadow:0 18px 36px -18px rgba(15,13,38,.8);overflow:hidden;min-width:0}
.code-top{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--code-line)}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#ff4f6d}.dots i:nth-child(2){background:#ffb020}.dots i:nth-child(3){background:#1ed39a}
.code-top .fn{margin-left:auto;font:600 13px var(--f-code);color:#a6a2d6}
.code pre{margin:0;padding:18px 20px;font:600 clamp(14px,1.25vw,18px)/1.7 var(--f-code);overflow-x:auto;white-space:pre}
.code pre .ln{display:block;border-radius:8px;padding:0 8px;margin:0 -8px;transition:background .2s}
.k-fn{color:#6fd3ff}.k-str{color:#9df07a}.k-num{color:#ffb35c}.k-kw{color:#c792ff}.k-com{color:#7a77a6;font-style:italic}.k-op{color:#ff8fc2}
.term{background:#070617;color:#4bf0a6;border-radius:var(--r-md);font:700 clamp(15px,1.3vw,19px)/1.6 var(--f-code);padding:16px 18px;min-height:64px;white-space:pre-wrap;word-break:break-word}
.term .p{color:#6c6995;margin-right:10px}
.term .err{color:#ff6b8f}
.term .hint{color:#ffd76b;font-family:var(--f-body);font-weight:700;font-size:.92em;display:block;margin-top:6px}
.term .muted{color:#6c6995}
.fld{display:flex;flex-direction:column;gap:5px;margin:8px 0;font:800 14px var(--f-display);color:var(--ink-2)}
.fld input{font:700 16px var(--f-body);padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}
.dark .fld input{background:#161335;border-color:#35306a;color:#eeeaff}
.fld input:focus{border-color:var(--violet)}
.seg{display:inline-flex;background:var(--card-2);border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{padding:9px 14px;border-radius:11px;font:800 14px var(--f-display);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff;box-shadow:0 3px 8px -2px rgba(123,92,255,.6)}
#bar{position:relative;z-index:5;margin:8px auto 0;width:100%;max-width:1760px;display:flex;align-items:center;gap:6px;background:var(--bar);color:#dcdaf5;border-radius:24px;padding:9px 12px;box-shadow:0 18px 30px -14px rgba(20,18,60,.6)}
#bar .bb{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;font:800 14px var(--f-display);color:#dcdaf5}
#bar .bb:hover{background:var(--bar-2)}
#bar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}
#bar .nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bar-2)}
#bar .nav.next{background:linear-gradient(135deg,#ff4fb2,#a64dff);color:#fff;box-shadow:0 6px 16px -6px rgba(255,79,178,.8)}
#bar .cnt{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;font:800 17px var(--f-code);color:#fff}
#bar .cnt small{color:#8d8ab6;font-weight:600;margin:0 4px}
#bar .prog{width:84px;height:5px;border-radius:5px;background:#3b3e68;overflow:hidden}
#bar .prog i{display:block;height:100%;background:linear-gradient(90deg,#ff4fb2,#a64dff);transition:width .3s}
.ov{position:fixed;inset:0;z-index:20;background:rgba(22,18,60,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.ov-card{background:#fff;color:#1c1940;border-radius:30px;box-shadow:var(--clay);width:100%;max-width:1100px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.ov-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #eee9ff}
.ov-head h2{margin:0;font:900 22px var(--f-display);flex:1}
.ov-body{overflow:auto;padding:20px 22px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.thumb{text-align:left;background:#f6f3ff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 #fff inset,0 6px 14px -10px rgba(64,40,150,.4);transition:transform .15s}
.thumb:hover{transform:translateY(-3px);background:#efeaff}
.thumb.cur{box-shadow:inset 0 0 0 2.5px #7b5cff}
.thumb b{font:800 12px var(--f-code);color:#7b5cff}
.thumb span{font:800 14.5px/1.25 var(--f-display);color:#1c1940}
.thumb em{font-style:normal;font-size:12px;color:#8a87a8}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:#1c1940;color:#fff;padding:12px 18px;border-radius:14px;font:800 15px var(--f-display);box-shadow:0 12px 24px -10px rgba(0,0,0,.5)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.tc{position:relative;width:100%;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:var(--clay-sm),0 0 0 1px #e9e4ff;background:#fbfaff}
.tc canvas{display:block}
.tc-badge{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:#3a375e;font:700 12px var(--f-code);padding:5px 9px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.cover h1.t{font-size:clamp(32px,4.6vw,64px);max-width:22ch}
.cover-art{position:relative;width:min(560px,100%);aspect-ratio:16/9}
.cover-art .ped{position:absolute;left:50%;bottom:2%;width:46%;height:20%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fff 0%,#ece6ff 60%,#d6ccff 100%);box-shadow:0 18px 30px -12px rgba(80,50,180,.45)}
.cover-art .hero{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);font-size:clamp(90px,16vw,170px)}
.cover-art .fl{position:absolute;font-size:clamp(34px,5vw,60px)}
.loader{position:relative;width:min(520px,100%);height:54px;border-radius:999px;background:#fff;box-shadow:var(--clay);overflow:hidden;border:3px solid #ffe39a}
.loader i{position:absolute;inset:4px auto 4px 4px;border-radius:999px;background:linear-gradient(90deg,#ffd23f,#ffb01f);box-shadow:0 2px 0 rgba(255,255,255,.7) inset;width:calc(var(--p,0%) - 8px);min-width:40px;transition:width .2s}
.loader span{position:relative;z-index:1;display:grid;place-items:center;height:100%;font:800 16px var(--f-display);color:#6a4300}
.sec{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:30px;align-items:center;min-height:min(62vh,560px)}
.sec h1.t{font-size:clamp(36px,5.2vw,74px)}
.sec .art{position:relative;display:grid;place-items:center;min-height:280px}
.sec .art .emj.big{font-size:clamp(140px,26vh,240px)}
.eyebrow{font:800 clamp(22px,2.6vw,34px) var(--f-code);color:#2f6bff;margin-bottom:6px}
.fact{display:flex;gap:14px;align-items:center;margin-top:18px;background:#fff8dc;border-radius:20px;padding:14px 18px;box-shadow:var(--clay-sm);color:#6a4a00;font-size:16px;line-height:1.45}
.dark .fact{background:rgba(255,207,74,.12);color:#ffd76b}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;position:relative}
.map::before{content:"";position:absolute;left:12%;right:12%;top:62px;border-top:4px dashed #c8bcff;z-index:0}
.mission{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.mission .n{font:900 14px var(--f-display);color:#fff;background:var(--violet);border-radius:999px;padding:6px 12px}
.mission .card-t{margin:0}
.bigq{display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;padding:10px 0 20px}
.bigq h1.t{font-size:clamp(30px,4.2vw,58px);max-width:20ch}
.bigq .arts{display:flex;gap:30px;justify-content:center;align-items:center}
.yn{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.reply{max-width:760px;border-radius:24px;padding:18px 22px;font-size:18px;line-height:1.5;text-align:left;display:flex;gap:16px;align-items:center;box-shadow:var(--clay)}
.reply.ok{background:var(--ok-bg)}
.reply.no{background:#fff4e3}
.reveal>*{animation:rise .5s both}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.def{font:900 clamp(28px,3.4vw,46px)/1.15 var(--f-display);margin:0;color:var(--ink)}
.def em{font-style:normal;background:linear-gradient(transparent 60%,#ffe27a 60%)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.places{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.places .btn.pick-bad{background:linear-gradient(135deg,#ff6f9b,#ff4f6d);box-shadow:0 7px 0 #c32a4c}
.platform{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;min-height:min(66vh,620px)}
.platform .arts{display:flex;align-items:flex-end;gap:26px}
.platform h1.t{font-size:clamp(34px,4.8vw,68px);max-width:20ch;margin:0}
.platform .no{display:inline-block;background:linear-gradient(135deg,#ffa31a,#ff6a2b);color:#fff;border-radius:.3em;padding:0 .25em}
.platform p.lead{margin:0;text-align:center}
.flip{perspective:1000px;min-height:280px;text-align:left}
.flip .in{position:relative;height:100%;min-height:280px;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);box-shadow:var(--clay);padding:22px;display:flex;flex-direction:column}
.flip .f{background:var(--card);align-items:center;justify-content:center;text-align:center;gap:10px}
.flip .b{background:linear-gradient(150deg,#7b5cff,#b04dff);color:#fff;transform:rotateY(180deg);justify-content:center;gap:10px}
.flip .b .card-t{color:#fff;margin:0}
.flip .b p{margin:0;line-height:1.5;font-size:16px}
.flip .hintx{font-size:13px;color:var(--ink-3);font-weight:800}
.anat{display:flex;flex-direction:column;gap:18px;align-items:center}
.anat .code{width:min(900px,100%)}
.anat pre.huge{font-size:clamp(30px,5vw,72px);line-height:1.25;text-align:center;padding:26px 20px}
.part{border-radius:14px;padding:0 4px;cursor:pointer;transition:background .2s,box-shadow .2s}
.part.on{background:rgba(255,255,255,.14);box-shadow:0 0 0 3px var(--pc)}
.bubbles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.bub{border-radius:20px;padding:14px 16px;background:var(--card);box-shadow:var(--clay-sm);border:3px solid transparent;text-align:left;font-size:15.5px;line-height:1.4;color:var(--ink-2);transition:transform .2s,border-color .2s}
.bub b{display:block;font:900 17px var(--f-code);margin-bottom:4px;color:var(--pc)}
.bub.on{border-color:var(--pc);transform:translateY(-5px)}
.cheat{width:100%;border-collapse:collapse;font-size:15px}
.cheat td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cheat td:first-child{white-space:nowrap}
.cheat code{font-family:var(--f-code);font-weight:700;background:var(--card-2);border-radius:10px;padding:4px 10px;color:var(--violet-d)}
.dark .cheat code{background:#26224f;color:#c9bfff}
.praise{margin:0;border-radius:14px;padding:12px 16px;background:rgba(30,211,154,.12);border:1px solid rgba(30,211,154,.35);color:#0b8a63;font-weight:700;font-size:15px}
.dark .praise{color:#9ff5cf}
@media (max-width:900px){
.g3,.map,.bubbles,.split{grid-template-columns:minmax(0,1fr)}
.map::before{display:none}
.sec{grid-template-columns:minmax(0,1fr)}
#bar .lbl{display:none}
}
@media (max-width:560px){
.g2{grid-template-columns:minmax(0,1fr)}
.slide{padding:18px 14px 26px;border-radius:26px}
#bar{gap:2px;padding:6px 8px}#bar .bb{padding:8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="app">

<script>
/* ===== Мини-Python: print(), input(), числа, строки, for-range, turtle (+penup/pendown/заливка) ===== */
const PY = (() => {
class PyErr extends Error { constructor(type, msg, hint, line){ super(msg); this.type = type; this.hint = hint || ''; this.line = line; } }
const I = v => ({ t:'int', v }), F = v => ({ t:'float', v }), S = v => ({ t:'str', v }), L = v => ({ t:'list', v });
const isNum = x => x.t === 'int' || x.t === 'float';
const TYPE = x => ({ int:'int', float:'float', str:'str', list:'list', range:'range' })[x.t];
const TURTLE = {
forward:'fd', fd:'fd', backward:'bk', back:'bk', bk:'bk', left:'lt', lt:'lt', right:'rt', rt:'rt',
color:'color', pencolor:'color', width:'width', pensize:'width', penup:'up', pu:'up', up:'up',
pendown:'down', pd:'down', down:'down', goto:'goto', setpos:'goto', setposition:'goto', home:'home',
setheading:'seth', seth:'seth', circle:'circle', speed:'speed', shape:'noop', exitonclick:'noop',
done:'noop', mainloop:'noop', hideturtle:'hide', ht:'hide', showturtle:'show', st:'show',
bgcolor:'noop', begin_fill:'begin', end_fill:'end', fillcolor:'fillcolor', Screen:'noop'
};
const ARGNAME = { fd:'distance', bk:'distance', lt:'angle', rt:'angle', seth:'to_angle', width:'width', circle:'radius', speed:'speed' };
const BUILTIN = ['print','range','len','str','int','abs','round','input'];
const ALLNAMES = BUILTIN.concat(Object.keys(TURTLE));
function fmtFloat(v){ if(!isFinite(v)) return v>0?'inf':v<0?'-inf':'nan'; if(Number.isInteger(v)&&Math.abs(v)<1e16) return v.toFixed(1); return String(v); }
function toStr(x){ if(x.t==='int')return String(x.v); if(x.t==='float')return fmtFloat(x.v); if(x.t==='str')return x.v; if(x.t==='list')return '['+x.v.map(repr).join(', ')+']'; if(x.t==='range')return 'range(...)'; return '?'; }
function repr(x){ return x.t==='str' ? "'"+x.v+"'" : toStr(x); }
function tokenize(s, line){
const toks=[]; let i=0;
while(i<s.length){
const c=s[i];
if(c===' '||c==='\t'){i++;continue;}
if(c==='#')break;
if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
let j=i; while(j<s.length&&/[0-9_]/.test(s[j]))j++;
let f=false;
if(s[j]==='.'){f=true;j++;while(j<s.length&&/[0-9]/.test(s[j]))j++;}
if(/[A-Za-zА-Яа-яЁё_]/.test(s[j]||''))throw new PyErr('SyntaxError','invalid decimal literal','Число и буквы склеились. Поставь между ними пробел или знак действия.',line);
toks.push({k:'num',v:Number(s.slice(i,j).replace(/_/g,'')),f}); i=j; continue;
}
if(c==="'"||c==='"'){
let j=i+1,out='';
while(j<s.length&&s[j]!==c){
if(s[j]==='\\'&&j+1<s.length){const n=s[j+1];out+=n==='n'?'\n':n==='t'?'\t':n;j+=2;continue;}
out+=s[j];j++;
}
if(j>=s.length){
const other=c==="'"?'"':"'";
const hint=s.slice(i+1).includes(other)?'Кавычки должны быть одинаковыми: открыл '+c+' — закрой тоже '+c+'.':'Кавычка открыта, но не закрыта. Поставь такую же кавычку в конце текста.';
throw new PyErr('SyntaxError','unterminated string literal',hint,line);
}
toks.push({k:'str',v:out}); i=j+1; continue;
}
if(/[A-Za-zА-Яа-яЁё_]/.test(c)){
let j=i; while(j<s.length&&/[A-Za-z0-9А-Яа-яЁё_]/.test(s[j]))j++;
toks.push({k:'name',v:s.slice(i,j)}); i=j; continue;
}
const two=s.slice(i,i+2);
if(['**','//','==','!=','<=','>='].includes(two)){toks.push({k:'op',v:two});i+=2;continue;}
if('+-*/%()[],=:.<>'.includes(c)){toks.push({k:'op',v:c});i++;continue;}
if('«»“”„‘’'.includes(c))throw new PyErr('SyntaxError',`invalid character '${c}'`,"Используй обычные кавычки ' или \" — не «ёлочки» и не «лапки».",line);
if('（）'.includes(c))throw new PyErr('SyntaxError',`invalid character '${c}'`,'Скобка набрана не той раскладкой. Используй обычные ( и ).',line);
throw new PyErr('SyntaxError',`invalid character '${c}'`,'В коде есть символ, который Python не понимает.',line);
}
return toks;
}
function arith(op,a,b,line){
const bothInt=a.t==='int'&&b.t==='int';
if(op==='+'){
if(isNum(a)&&isNum(b))return bothInt?I(a.v+b.v):F(a.v+b.v);
if(a.t==='str'&&b.t==='str')return S(a.v+b.v);
if(a.t==='list'&&b.t==='list')return L(a.v.concat(b.v));
if(a.t==='str')throw new PyErr('TypeError',`can only concatenate str (not "${TYPE(b)}") to str`,"Нельзя склеить текст и число. Возьми число в кавычки ('10') или раздели запятой: print('Мне', 10)",line);
throw new PyErr('TypeError',`unsupported operand type(s) for +: '${TYPE(a)}' and '${TYPE(b)}'`,'Число и текст нельзя сложить. Сделай оба значения текстом или оба числами.',line);
}
if(op==='*'){
if(isNum(a)&&isNum(b))return bothInt?I(a.v*b.v):F(a.v*b.v);
const seq=a.t==='str'||a.t==='list'?a:b.t==='str'||b.t==='list'?b:null;
const n=seq===a?b:a;
if(seq&&n.t==='int'){const k=Math.max(0,n.v);if(k*(seq.v.length||1)>100000)throw new PyErr('MemoryError','слишком длинная строка','Попробуй число поменьше.',line);return seq.t==='str'?S(seq.v.repeat(k)):L([].concat(...Array(k).fill(seq.v)));}
if(seq)throw new PyErr('TypeError',`can't multiply sequence by non-int of type '${TYPE(n)}'`,"Текст можно умножать только на целое число: 'Мяу' * 3",line);
}
if(!(isNum(a)&&isNum(b)))throw new PyErr('TypeError',`unsupported operand type(s) for ${op}: '${TYPE(a)}' and '${TYPE(b)}'`,'Это действие работает только с числами. Числа пишутся без кавычек.',line);
if(op==='-')return bothInt?I(a.v-b.v):F(a.v-b.v);
if((op==='/'||op==='//'||op==='%')&&b.v===0)throw new PyErr('ZeroDivisionError','division by zero','На ноль делить нельзя — даже компьютеру!',line);
if(op==='/')return F(a.v/b.v);
if(op==='//')return bothInt?I(Math.floor(a.v/b.v)):F(Math.floor(a.v/b.v));
if(op==='%'){const r=((a.v%b.v)+b.v)%b.v;return bothInt?I(r):F(r);}
if(op==='**'){const r=Math.pow(a.v,b.v);return bothInt&&b.v>=0?I(r):F(r);}
throw new PyErr('SyntaxError','invalid syntax','',line);
}
function parser(toks,ctx,line){
let p=0;
const peek=()=>toks[p],next=()=>toks[p++];
const isOp=v=>toks[p]&&toks[p].k==='op'&&toks[p].v===v;
function expect(v,hint){
if(isOp(v)){p++;return;}
if(!toks[p]&&v===')')throw new PyErr('SyntaxError'," '(' was never closed",'Скобка открыта, но не закрыта. Поставь ) в конце.',line);
if(!toks[p]&&v===']')throw new PyErr('SyntaxError',"'[' was never closed",'Квадратная скобка не закрыта. Поставь ] в конце.',line);
throw new PyErr('SyntaxError','invalid syntax',hint||'Похоже, пропущена запятая или знак действия.',line);
}
function expr(){return add();}
function add(){let a=term();while(isOp('+')||isOp('-')){const op=next().v;a=arith(op,a,term(),line);}return a;}
function term(){let a=unary();while(isOp('*')||isOp('/')||isOp('//')||isOp('%')){const op=next().v;a=arith(op,a,unary(),line);}return a;}
function unary(){
if(isOp('-')){next();const v=unary();if(!isNum(v))throw new PyErr('TypeError',`bad operand type for unary -: '${TYPE(v)}'`,'Минус ставится только перед числом.',line);return v.t==='int'?I(-v.v):F(-v.v);}
if(isOp('+')){next();return unary();}
return power();
}
function power(){const a=postfix();if(isOp('**')){next();return arith('**',a,unary(),line);}return a;}
function postfix(){
let a=atom();
while(isOp('[')){next();const ix=expr();expect(']');
if(!(a.t==='list'||a.t==='str'))throw new PyErr('TypeError',`'${TYPE(a)}' object is not subscriptable`,'',line);
if(ix.t!=='int')throw new PyErr('TypeError','indices must be integers','Номер элемента — целое число.',line);
let k=ix.v<0?a.v.length+ix.v:ix.v;
if(k<0||k>=a.v.length)throw new PyErr('IndexError','index out of range','Такого номера в списке нет. Нумерация начинается с 0!',line);
a=a.t==='str'?S([...a.v][k]):a.v[k];
}
return a;
}
function callArgs(){
expect('(');
const args=[];
if(!isOp(')')){args.push(expr());while(isOp(',')){next();if(isOp(')'))break;args.push(expr());}}
expect(')','Похоже, между значениями пропущена запятая.');
return args;
}
function atom(){
const t=next();
if(!t)throw new PyErr('SyntaxError','invalid syntax','Выражение оборвалось — чего-то не хватает.',line);
if(t.k==='num')return t.f?F(t.v):I(t.v);
if(t.k==='str')return S(t.v);
if(t.k==='op'&&t.v==='('){const v=expr();expect(')');return v;}
if(t.k==='op'&&t.v==='['){
const items=[];
if(!isOp(']')){items.push(expr());while(isOp(',')){next();if(isOp(']'))break;items.push(expr());}}
expect(']');return L(items);
}
if(t.k==='name'){
if(isOp('(')){const args=callArgs();return callExpr(t.v,args,ctx,line);}
if(Object.prototype.hasOwnProperty.call(ctx.env,t.v))return ctx.env[t.v];
if(t.v==='True')return I(1); if(t.v==='False')return I(0);
throw nameErr(t.v,ctx,line,true);
}
throw new PyErr('SyntaxError','invalid syntax','Здесь стоит лишний знак.',line);
}
return { expr, peek, next, isOp, expect, callArgs, done:()=>p>=toks.length, rest:()=>toks.slice(p) };
}
function nameErr(name,ctx,line,inExpr){
const low=name.toLowerCase();
let hint;
if(name!==low&&ALLNAMES.includes(low))hint=`Python различает заглавные и строчные буквы! Пиши ${low} с маленькой буквы.`;
else if(TURTLE[name]&&!ctx.turtle)hint='Сначала подключи черепашку: from turtle import *';
else if(inExpr)hint=`Если «${name}» — это текст, возьми его в кавычки: '${name}'`;
else hint='Python не знает такой команды. Проверь, нет ли опечатки.';
return new PyErr('NameError',`name '${name}' is not defined`,hint,line);
}
function callExpr(name,args,ctx,line){
if(name==='range'){
const n=args.map(a=>{if(a.t!=='int')throw new PyErr('TypeError','range() needs integers','В range() пишут целые числа: range(4)',line);return a.v;});
let[a,b,c]=n.length===1?[0,n[0],1]:n.length===2?[n[0],n[1],1]:n;
if(!c)throw new PyErr('ValueError','range() arg 3 must not be zero','',line);
const out=[];for(let i=a;c>0?i<b:i>b;i+=c){out.push(i);if(out.length>100000)break;}
return {t:'range',v:out};
}
if(name==='len'){const a=args[0];if(!a||!(a.t==='str'||a.t==='list'))throw new PyErr('TypeError','len() needs str or list','',line);return I([...a.v].length);}
if(name==='str')return S(args[0]?toStr(args[0]):'');
if(name==='int'){
const a=args[0];if(!a)return I(0);
if(isNum(a))return I(Math.trunc(a.v));
if(a.t==='str'&&/^\s*[-+]?\d+\s*$/.test(a.v))return I(parseInt(a.v,10));
throw new PyErr('ValueError',`invalid literal for int(): '${a.v}'`,'Это не похоже на целое число.',line);
}
if(name==='abs'){const a=args[0];return a.t==='int'?I(Math.abs(a.v)):F(Math.abs(a.v));}
if(name==='round'){const a=args[0];return I(Math.round(a.v));}
if(name==='input'){
const pr=args.length?toStr(args[0]):'';
if(pr)ctx.out.push({t:'out',v:pr});
const v=ctx.inp.length?String(ctx.inp.shift()):'';
return S(v);
}
if(name==='print'||TURTLE[name])throw new PyErr('SyntaxError','invalid syntax',`${name}() — это команда. Пиши её в отдельной строке.`,line);
throw nameErr(name,ctx,line,false);
}
function num(a,cmd,line){
if(!a)throw new PyErr('TypeError',`${cmd}() missing 1 required positional argument: '${ARGNAME[TURTLE[cmd]]||'x'}'`,`Внутри скобок нужно число: ${cmd}(90)`,line);
if(!isNum(a))throw new PyErr('TypeError',`${cmd}() argument must be a number, not '${TYPE(a)}'`,'Число пишется без кавычек: forward(150), а не forward(\'150\').',line);
return a.v;
}
function validColor(c){ if(typeof CSS!=='undefined'&&CSS.supports)return CSS.supports('color',c); return /^[a-z]+$|^#[0-9a-f]{3,8}$/i.test(c); }
function callStmt(name,args,ctx,line){
if(name==='print'){ctx.out.push({t:'out',v:args.map(toStr).join(' ')});return;}
const op=TURTLE[name];
if(op){
if(!ctx.turtle)throw nameErr(name,ctx,line,false);
const C=ctx.cmds;
switch(op){
case 'fd': C.push({op:'fd',v:num(args[0],name,line),line}); break;
case 'bk': C.push({op:'fd',v:-num(args[0],name,line),line}); break;
case 'lt': C.push({op:'turn',v:num(args[0],name,line),line}); break;
case 'rt': C.push({op:'turn',v:-num(args[0],name,line),line}); break;
case 'seth': C.push({op:'seth',v:num(args[0],name,line),line}); break;
case 'width': C.push({op:'width',v:num(args[0],name,line),line}); break;
case 'speed': { const a=args[0]; let v=3; if(a&&isNum(a))v=a.v; else if(a&&a.t==='str')v=({fastest:0,fast:10,normal:6,slow:3,slowest:1})[a.v]??3; C.push({op:'speed',v,line}); break; }
case 'up': C.push({op:'up',line}); break;
case 'down': C.push({op:'down',line}); break;
case 'hide': C.push({op:'hide',line}); break;
case 'show': C.push({op:'show',line}); break;
case 'begin': C.push({op:'begin',line}); break;
case 'end': C.push({op:'end',line}); break;
case 'home': C.push({op:'goto',x:0,y:0,line},{op:'seth',v:0,line}); break;
case 'goto': {
let x,y;
if(args.length===1&&args[0].t==='list'){x=args[0].v[0];y=args[0].v[1];}else{x=args[0];y=args[1];}
if(!x||!y)throw new PyErr('TypeError','goto() missing argument','Нужны две координаты: goto(100, 50)',line);
C.push({op:'goto',x:num(x,name,line),y:num(y,name,line),line}); break;
}
case 'fillcolor': case 'color': {
const a=args[0];
if(!a)break;
if(a.t!=='str')throw new PyErr('TurtleGraphicsError',`bad color string: ${toStr(a)}`,"Цвет пишется в кавычках: color('red')",line);
if(!validColor(a.v))throw new PyErr('TurtleGraphicsError',`bad color string: ${a.v}`,"Черепашка не знает такого цвета. Попробуй 'red', 'blue', 'green', 'black', 'orange', 'purple', 'yellow'.",line);
C.push({op:op==='color'?'color':'fillcolor',v:a.v,line}); break;
}
case 'circle': {
const r=num(args[0],name,line);
const ext=args[1]?num(args[1],name,line):360;
const frac=Math.abs(ext)/360;
const steps=1+Math.floor(Math.min(11+Math.abs(r)/6,59)*frac);
let w=ext/steps,w2=w/2,l=2*r*Math.sin(w2*Math.PI/180);
if(r<0){l=-l;w=-w;w2=-w2;}
C.push({op:'turn',v:w2,line,q:1});
for(let i=0;i<steps;i++){C.push({op:'fd',v:l,line,q:1});C.push({op:'turn',v:w,line,q:1});}
C.push({op:'turn',v:-w2,line,q:1});
break;
}
default: break;
}
if(C.length>60000)throw new PyErr('RuntimeError','слишком много команд','Черепашка устала: уменьши число повторений.',line);
return;
}
throw nameErr(name,ctx,line,false);
}
function build(src){
const items=[];
src.replace(/\r/g,'').split('\n').forEach((raw,i)=>{
const t=raw.replace(/\s+$/,'');
if(!t.trim()||t.trim().startsWith('#'))return;
const ind=t.match(/^[ \t]*/)[0].replace(/\t/g,'    ').length;
items.push({i,ind,text:t.trim()});
});
let p=0;
function block(ind){
const out=[];
while(p<items.length){
const it=items[p];
if(it.ind<ind)break;
if(it.ind>ind)throw new PyErr('IndentationError','unexpected indent','Убери лишние пробелы в начале строки — команда должна начинаться с самого края.',it.i);
p++;
const node={line:it.i,text:it.text};
if(/^for\b/.test(it.text)){
node.type='for';
const nx=items[p];
if(!nx||nx.ind<=ind)throw new PyErr('IndentationError','expected an indented block','Команды внутри цикла пишутся с отступом в 4 пробела.',nx?nx.i:it.i);
node.body=block(nx.ind);
}
out.push(node);
}
return out;
}
return block(0);
}
function runNode(n,ctx){
if(++ctx.steps>200000)throw new PyErr('RuntimeError','программа работает слишком долго','Уменьши число повторений.',n.line);
const toks=tokenize(n.text,n.line);
if(!toks.length)return;
const v0=toks[0].k==='name'?toks[0].v:null;
if(n.type==='for'){
if(!(toks[1]&&toks[1].k==='name'&&toks[2]&&toks[2].v==='in'))throw new PyErr('SyntaxError','invalid syntax','Цикл пишется так: for i in range(4):',n.line);
const last=toks[toks.length-1];
if(!(last.k==='op'&&last.v===':'))throw new PyErr('SyntaxError',"expected ':'",'В конце строки с for нужно двоеточие.',n.line);
const P=parser(toks.slice(3,-1),ctx,n.line);
const it=P.expr();
if(!P.done())throw new PyErr('SyntaxError','invalid syntax','',n.line);
let seq;
if(it.t==='range')seq=it.v.map(I);
else if(it.t==='list')seq=it.v;
else if(it.t==='str')seq=[...it.v].map(S);
else throw new PyErr('TypeError',`'${TYPE(it)}' object is not iterable`,'После in обычно пишут range(число).',n.line);
for(const v of seq){ctx.env[toks[1].v]=v;for(const b of n.body)runNode(b,ctx);}
return;
}
if(v0==='from'){
const txt=toks.map(t=>t.v).join(' ');
if(txt==='from turtle import *'){ctx.turtle=true;return;}
if(toks[1]&&toks[1].v!=='turtle')throw new PyErr('ModuleNotFoundError',`No module named '${toks[1].v}'`,'Модуль черепашки называется turtle.',n.line);
if(toks[1]&&toks[1].v==='turtle'&&txt.startsWith('from turtle import')){ctx.turtle=true;return;}
throw new PyErr('SyntaxError','invalid syntax','Подключение пишется так: from turtle import *',n.line);
}
if(v0==='import'){
if(toks[1]&&toks[1].v==='turtle'){ctx.turtle=true;return;}
throw new PyErr('ModuleNotFoundError',`No module named '${toks[1]?toks[1].v:''}'`,'',n.line);
}
if(v0&&toks[1]&&toks[1].k==='op'&&toks[1].v==='='){
if(ALLNAMES.includes(v0))throw new PyErr('SyntaxError','invalid syntax',`«${v0}» — имя команды. Скобки забыл? ${v0}(...)`,n.line);
const P=parser(toks.slice(2),ctx,n.line);
const val=P.expr();

let cur=0;
const N=META.length,slideEl=$('#slide');
function head(m,i){
return `<div class="sl-head"><span class="chip num">СЛАЙД ${i+1} ИЗ ${N}</span><span class="chip">${esc(m.tag)}</span><span class="sp"></span><span class="chip badge">✨ ${esc(m.badge)}</span></div>`;
}
let curWrap=null;
function fitSlide(){
const w=curWrap;if(!w)return;
w.style.zoom='';
if(innerWidth<900)return;
const cs=getComputedStyle(slideEl),padV=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
let k=1;
for(let n=0;n<5;n++){
const content=slideEl.scrollHeight-padV,avail=slideEl.clientHeight-padV;
if(content<=avail+1)break;
k=Math.max(0.55,k*avail/content);
w.style.zoom=k;
if(k===0.55)break;
}
}
let fitT;
window.addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitSlide,120);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitSlide);
function render(i,anim=true){
if(curWrap&&curWrap._cleanup){try{curWrap._cleanup();}catch(e){}}
cur=Math.max(0,Math.min(N-1,i));
const m=META[cur],r=R[m.id]||{html:()=>''};
const dark=m.mood==='lab'||m.mood==='night';
document.body.dataset.bg=m.mood==='lab'?'lab':m.mood==='night'?'night':String(cur%5);
slideEl.className='slide'+(dark?' dark':'');
const wrap=document.createElement('div');
wrap.innerHTML=head(m,cur)+(r.own?'':`<h1 class="t">${esc(m.title)}</h1>${m.lead&&m.text?`<p class="lead">${esc(m.text)}</p>`:''}`)+`<div class="body">${r.html(m)}</div>`;
slideEl.replaceChildren(wrap);curWrap=wrap;
slideEl.scrollTop=0;
if(anim){slideEl.classList.remove('anim');void slideEl.offsetWidth;slideEl.classList.add('anim');}
if(r.mount)r.mount(wrap,m);
fitSlide();
$('#cN').textContent=cur+1;$('#cT').textContent=N;$('#cP').style.width=((cur+1)/N*100)+'%';
try{history.replaceState(null,'','#s'+(cur+1));}catch(e){}
}
function goTo(i){if(i<0||i>=N||i===cur)return;render(i);}
$('#bPrev').onclick=()=>goTo(cur-1);
$('#bNext').onclick=()=>goTo(cur+1);
$('#bRestart').onclick=()=>goTo(0);
$('#bFull').onclick=()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>toast('Полноэкранный режим недоступен здесь'));else document.exitFullscreen();}catch(e){toast('Полноэкранный режим недоступен здесь');}};
document.addEventListener('keydown',e=>{
if(e.target.closest('textarea,input'))return;
if(!$('#ovGrid').hidden){if(e.key==='Escape')$$('.ov').forEach(o=>o.hidden=true);return;}
if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goTo(cur+1);}
if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goTo(cur-1);}
if(e.key==='Home')goTo(0);if(e.key==='End')goTo(N-1);
});
$$('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))o.hidden=true;}));
$('#bGrid').onclick=()=>{
$('#thumbs').innerHTML=META.map((m,i)=>`<button class="thumb ${i===cur?'cur':''}" data-i="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(m.title)}</span><em>${esc(m.tag)} · ${esc(m.badge)}</em></button>`).join('');
$('#ovGrid').hidden=false;
};
$('#thumbs').addEventListener('click',e=>{const t=e.target.closest('.thumb');if(t){$('#ovGrid').hidden=true;goTo(+t.dataset.i);}});
